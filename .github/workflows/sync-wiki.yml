name: Sync Wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync wiki folder to GitHub wiki
        uses: gouef/github-wiki-sync-repository-action@v1.0.1
        with:
          source: wiki
          user-name: Oleksii Lisikh
          user-email: alisiikh@gmail.com
