name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim git build-essential curl

      - name: Install Neovim plugins
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          git clone --depth 1 https://github.com/nvim-treesitter/nvim-treesitter \
            ~/.local/share/nvim/site/pack/vendor/start/nvim-treesitter

      - name: Install tree-sitter scala parser
        run: |
          nvim --headless --clean -u tests/minimal_init.lua \
            -c "TSInstallSync scala" \
            -c "q"

      - name: Run tests
        run: make test
